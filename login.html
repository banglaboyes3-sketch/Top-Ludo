<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Top Ludo - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #0a0a1a 0%, #0d1b2a 50%, #000 100%);
      color: #fff; min-height: 100vh; padding: 20px;
    }
    .box {
      max-width: 400px; margin: 40px auto;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 16px; padding: 28px 20px;
    }
    h1 {
      text-align: center; font-size: 24px; margin-bottom: 6px;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 12px; text-align: center; border-radius: 10px;
      background: rgba(255,255,255,0.05); color: #888; font-weight: 600;
      cursor: pointer; border: 1px solid transparent;
    }
    .tab.active { background: linear-gradient(90deg, #FFD700, #FFA500); color: #000; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; margin-top: 14px; }
    input {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,215,0,0.25);
      background: #0f0f1a; color: #fff; font-size: 16px;
    }
    input:focus { outline: none; border-color: #FFD700; }
    .btn {
      width: 100%; padding: 16px; margin-top: 20px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      background: linear-gradient(90deg, #FFD700, #FFA500); color: #000;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-secondary {
      background: transparent; border: 1px solid rgba(255,215,0,0.4); color: #FFD700; margin-top: 10px;
    }
    .msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .msg.error { background: #7f1d1d; display: block; }
    .msg.success { background: #14532d; display: block; }
    .msg.info { background: #1e3a5f; display: block; }
    .hidden { display: none; }
    .otp-input {
      letter-spacing: 10px; font-size: 24px; text-align: center; font-weight: bold;
    }
    .back { text-align: center; margin-top: 16px; }
    .back a { color: #FFD700; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div style="text-align:center;margin-bottom:12px;"><img src="/logo.png" alt="Top Ludo" style="width:100px;height:100px;object-fit:contain;border-radius:16px;"></div>
    <h1>Top Ludo</h1>
    <p class="sub">Gmail OTP দিয়ে লগইন / রেজিস্টার</p>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <div class="tab active" onclick="showTab('login')">Login</div>
      <div class="tab" onclick="showTab('register')">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <label>Gmail</label>
      <input type="email" id="loginEmail" placeholder="you@gmail.com" autocomplete="email">
      <button class="btn" id="loginBtn" onclick="sendLoginOTP()">OTP পাঠান</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="hidden">
      <label>নাম</label>
      <input type="text" id="regName" placeholder="আপনার নাম">
      <label>মোবাইল নম্বর</label>
      <input type="tel" id="regPhone" placeholder="01XXXXXXXXX">
      <label>Gmail</label>
      <input type="email" id="regEmail" placeholder="you@gmail.com" autocomplete="email">
      <button class="btn" id="regBtn" onclick="sendRegisterOTP()">OTP পাঠান</button>
    </div>

    <!-- OTP FORM -->
    <div id="otpForm" class="hidden">
      <p class="sub" id="otpHint">Gmail-এ OTP পাঠানো হয়েছে</p>
      <label>৬ ডিজিট OTP</label>
      <input type="text" id="otpInput" class="otp-input" maxlength="6" placeholder="------" inputmode="numeric">
      <button class="btn" id="verifyBtn" onclick="verifyOTP()">Verify & Continue</button>
      <button class="btn btn-secondary" onclick="backToForms()">ফিরে যান</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="back"><a href="/">← হোমে ফিরুন</a></div>
  </div>

  <script>
    const API = window.location.origin + '/api/auth';
    let currentEmail = '';
    let currentMode = 'login'; // login | register

    function showTab(tab) {
      currentMode = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('otpForm').classList.add('hidden');
      hideMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.className = 'msg ' + type;
      el.textContent = text;
    }
    function hideMsg() {
      document.getElementById('msg').className = 'msg';
      document.getElementById('msg').textContent = '';
    }

    function showOTPStep(email) {
      currentEmail = email;
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('tabs').classList.add('hidden');
      document.getElementById('otpForm').classList.remove('hidden');
      document.getElementById('otpHint').textContent = email + ' এ OTP পাঠানো হয়েছে';
      document.getElementById('otpInput').value = '';
      document.getElementById('otpInput').focus();
    }

    function backToForms() {
      document.getElementById('otpForm').classList.add('hidden');
      document.getElementById('tabs').classList.remove('hidden');
      if (currentMode === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
      } else {
        document.getElementById('registerForm').classList.remove('hidden');
      }
      hideMsg();
    }

    async function sendLoginOTP() {
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) return showMsg('Gmail লিখুন', 'error');
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'পাঠানো হচ্ছে...';
      hideMsg();
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        const res = await fetch(API + '/login-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        let msg = data.message;
        if (data.devOtp) {
          msg += '\n\n👉 OTP: ' + data.devOtp;
          showMsg(msg, 'info');
        } else {
          showMsg(msg, 'success');
        }
        showOTPStep(email);
      } catch (e) {
        showMsg(e.name === 'AbortError' ? 'Timeout - EMAIL settings check করুন বা আবার try করুন' : e.message, 'error');
      }
      btn.disabled = false;
      btn.textContent = 'OTP পাঠান';
    }

    async function sendRegisterOTP() {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      if (!name || !phone || !email) return showMsg('সব ঘর পূরণ করুন', 'error');
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = 'পাঠানো হচ্ছে...';
      hideMsg();
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        const res = await fetch(API + '/register-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email }),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        let msg = data.message;
        if (data.devOtp) {
          msg += '\n\n👉 OTP: ' + data.devOtp;
          showMsg(msg, 'info');
        } else {
          showMsg(msg, 'success');
        }
        showOTPStep(email);
      } catch (e) {
        showMsg(e.name === 'AbortError' ? 'Timeout - EMAIL settings check করুন বা আবার try করুন' : e.message, 'error');
      }
      btn.disabled = false;
      btn.textContent = 'OTP পাঠান';
    }

    async function verifyOTP() {
      const otp = document.getElementById('otpInput').value.trim();
      if (otp.length !== 6) return showMsg('৬ ডিজিট OTP লিখুন', 'error');
      const btn = document.getElementById('verifyBtn');
      btn.disabled = true;
      btn.textContent = 'যাচাই হচ্ছে...';
      try {
        const res = await fetch(API + '/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, otp })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showMsg(data.message + ' — রিডাইরেক্ট হচ্ছে...', 'success');
        setTimeout(() => { window.location.href = '/'; }, 800);
      } catch (e) {
        showMsg(e.name === 'AbortError' ? 'Timeout - EMAIL settings check করুন বা আবার try করুন' : e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Verify & Continue';
      }
    }
  </script>
</body>
</html>
