<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top Ludo - Real Money Ludo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a0a1a 0%, #0d1b2a 50%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-area img {
            height: 38px;
            width: auto;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .balance-box {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #FFD700;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #FFD700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #FFD700;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff3b3b;
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            padding: 80px 16px 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 28px;
        }

        .hero-logo {
            width: 160px;
            margin: 0 auto 12px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
        }

        .hero h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .hero p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #000;
        }

        .btn-play {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
        }

        .btn-deposit {
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
            color: white;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Feature Cards */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 28px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
        }

        .feature-card .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-card h3 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #FFD700;
        }

        .feature-card p {
            font-size: 11px;
            color: #aaa;
            line-height: 1.3;
        }

        /* ========== BOTTOM NAV ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(10, 10, 26, 0.98);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 215, 0, 0.15);
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #888;
            font-size: 11px;
            font-weight: 500;
            width: 70px;
            padding: 6px 0;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: #888;
        }

        .nav-item.active {
            color: #FFD700;
        }

        .nav-item.active svg {
            fill: #FFD700;
        }

        .nav-item.matches {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            transform: translateY(-12px);
            box-shadow: 0 6px 18px rgba(255, 215, 0, 0.4);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            justify-content: center;
            font-weight: 700;
        }

        .nav-item.matches svg {
            fill: #000;
            width: 28px;
            height: 28px;
        }

        .nav-item.matches span {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ========== TOP BAR ========== -->

    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">

            <img src="logo.png" alt="Top Ludo Logo" class="hero-logo" onerror="this.src='https://via.placeholder.com/160x160/FFD700/000000?text=TOP+LUDO'">

            <div class="btn-group">

        <div class="features">

            <div class="feature-card">

    <!-- ========== BOTTOM NAVIGATION ========== -->

<script>
function goProfile() {
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = '/login';
    return;
  }
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  const logout = confirm('Logged in as: ' + (user.name || '') + '\n' + (user.email || '') + '\nBalance: ৳' + (user.balance || 0) + '\n\nLogout?');
  if (logout) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    location.reload();
  }
}
async function loadUser() {
  const token = localStorage.getItem('token');
  if (!token) return;
  try {
    const res = await fetch('/api/auth/profile', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      return;
    }
    const user = await res.json();
    localStorage.setItem('user', JSON.stringify(user));
    const bal = document.getElementById('balance');
    if (bal) bal.textContent = Number(user.balance || 0).toFixed(2);
  } catch (e) {}
}
loadUser();
</script>
</body>

</html>
