<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Ludo - Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { color: #FFD700; margin-bottom: 20px; }
    .login-box, .panel { background: #1a1a2e; padding: 24px; border-radius: 12px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: #fff; }
    button { background: linear-gradient(90deg, #FFD700, #FFA500); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { opacity: 0.9; }
    .btn-sm { padding: 6px 12px; font-size: 13px; margin: 0 4px; }
    .btn-approve { background: #22c55e; color: #fff; }
    .btn-reject { background: #ef4444; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #FFD700; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab { padding: 10px 16px; background: #16213e; border-radius: 8px; cursor: pointer; }
    .tab.active { background: #FFD700; color: #000; }
    .msg { padding: 10px; border-radius: 8px; margin: 10px 0; }
    .error { background: #7f1d1d; }
    .success { background: #14532d; }
    .form-box { background: #0f0f1a; padding: 16px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #333; }
    .form-box label { display: block; font-size: 13px; color: #aaa; margin-top: 10px; margin-bottom: 4px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-row > div { flex: 1; min-width: 180px; }
    .method-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: #fff; }
    .status-on { color: #22c55e; font-weight: bold; }
    .status-off { color: #ef4444; font-weight: bold; }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: #fff; min-height: 70px; resize: vertical; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="display:flex;align-items:center;gap:10px;"><img src="/logo.png" style="width:40px;height:40px;border-radius:8px;" alt=""> Top Ludo Admin</h1>

    <!-- Login -->
    <div id="loginBox" class="login-box">
      <h2>Admin Login</h2>
      <input type="email" id="email" placeholder="Admin Email" value="admin@topludo.com">
      <input type="password" id="password" placeholder="Password" value="admin123">
      <button onclick="login()">Login</button>
      <div id="loginMsg"></div>
    </div>

    <!-- Panel -->
    <div id="panel" class="panel hidden">
      <div class="tabs">
        <div class="tab active" onclick="showTab('deposits')">Deposits</div>
        <div class="tab" onclick="showTab('withdraws')">Withdraws</div>
        <div class="tab" onclick="showTab('users')">Users</div>
        <div class="tab" onclick="showTab('settings')">Deposit Settings</div>
        <button class="btn-sm" onclick="logout()" style="margin-left:auto">Logout</button>
      </div>

      <div id="depositsTab">
        <h3>Pending Deposits</h3>
        <div id="depositsList">Loading...</div>
      </div>
      <div id="withdrawsTab" class="hidden">
        <h3>Pending Withdraws</h3>
        <div id="withdrawsList">Loading...</div>
      </div>
      <div id="usersTab" class="hidden">
        <h3>All Users</h3>
        <div id="usersList">Loading...</div>
      </div>

      <!-- Deposit Settings Tab -->
      <div id="settingsTab" class="hidden">
        <h3>Deposit Settings</h3>
        <p style="color:#aaa;font-size:13px;margin-bottom:12px;">এখানে bKash, Nagad, Rocket ইত্যাদি পেমেন্ট মেথড যোগ/এডিট/ডিলিট করতে পারবেন।</p>

        <!-- Add / Edit Form -->
        <div class="form-box">
          <h4 id="formTitle" style="color:#FFD700;margin-bottom:8px;">নতুন মেথড যোগ করুন</h4>
          <input type="hidden" id="editId" value="">
          <div class="form-row">
            <div>
              <label>নাম (Name) *</label>
              <input type="text" id="methodName" placeholder="bKash / Nagad / Rocket">
            </div>
            <div>
              <label>নম্বর (Number) *</label>
              <input type="text" id="methodNumber" placeholder="01XXXXXXXXX">
            </div>
          </div>
          <div class="form-row">
            <div>
              <label>লোগো URL (Logo URL)</label>
              <input type="text" id="methodLogo" placeholder="https://example.com/logo.png">
            </div>
            <div>
              <label>স্ট্যাটাস</label>
              <select id="methodActive" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#0f0f1a;color:#fff;">
                <option value="true">Active (চালু)</option>
                <option value="false">Inactive (বন্ধ)</option>
              </select>
            </div>
          </div>
          <label>ইনস্ট্রাকশন (Instructions)</label>
          <textarea id="methodInstructions" placeholder="যেমন: শুধু Personal নম্বরে টাকা পাঠাবেন। Send Money করবেন।"></textarea>
          <div style="display:flex;gap:10px;margin-top:8px;">
            <button onclick="saveMethod()" id="saveBtn">যোগ করুন</button>
            <button onclick="resetForm()" class="btn-sm" style="background:#555;color:#fff;display:none;" id="cancelBtn">Cancel</button>
          </div>
          <div id="settingsMsg"></div>
        </div>

        <!-- Methods List -->
        <h4 style="margin-top:20px;color:#FFD700;">বর্তমান মেথডসমূহ</h4>
        <div id="methodsList">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin + '/api/admin';
    let token = localStorage.getItem('adminToken');

    if (token) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      loadDeposits();
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      try {
        const res = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        token = data.token;
        localStorage.setItem('adminToken', token);
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('panel').classList.remove('hidden');
        loadDeposits();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('depositsTab').classList.add('hidden');
      document.getElementById('withdrawsTab').classList.add('hidden');
      document.getElementById('usersTab').classList.add('hidden');
      document.getElementById('settingsTab').classList.add('hidden');
      document.getElementById(name + 'Tab').classList.remove('hidden');
      if (name === 'deposits') loadDeposits();
      if (name === 'withdraws') loadWithdraws();
      if (name === 'users') loadUsers();
      if (name === 'settings') loadMethods();
    }

    async function loadDeposits() {
      const el = document.getElementById('depositsList');
      try {
        const res = await fetch(API + '/deposits', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        if (!data.length) { el.innerHTML = '<p>No pending deposits</p>'; return; }
        el.innerHTML = `<table><tr><th>Name</th><th>Phone</th><th>Amount</th><th>Txn ID</th><th>Action</th></tr>
          ${data.map(d => `<tr>
            <td>${d.name}</td><td>${d.phone}</td><td>৳${d.amount}</td><td>${d.transactionId || '-'}</td>
            <td>
              <button class="btn-sm btn-approve" onclick="depositAction('${d.userId}',${d.requestIndex},'approve')">Approve</button>
              <button class="btn-sm btn-reject" onclick="depositAction('${d.userId}',${d.requestIndex},'reject')">Reject</button>
            </td>
          </tr>`).join('')}</table>`;
      } catch (e) { el.innerHTML = '<p class="error">Failed to load</p>'; }
    }

    async function depositAction(userId, requestIndex, action) {
      await fetch(API + '/deposit-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ userId, requestIndex, action })
      });
      loadDeposits();
    }

    async function loadWithdraws() {
      const el = document.getElementById('withdrawsList');
      try {
        const res = await fetch(API + '/withdraws', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        if (!data.length) { el.innerHTML = '<p>No pending withdraws</p>'; return; }
        el.innerHTML = `<table><tr><th>Name</th><th>Phone</th><th>Amount</th><th>Account</th><th>Balance</th><th>Action</th></tr>
          ${data.map(d => `<tr>
            <td>${d.name}</td><td>${d.phone}</td><td>৳${d.amount}</td><td>${d.accountNumber}</td><td>৳${d.balance}</td>
            <td>
              <button class="btn-sm btn-approve" onclick="withdrawAction('${d.userId}',${d.requestIndex},'approve')">Approve</button>
              <button class="btn-sm btn-reject" onclick="withdrawAction('${d.userId}',${d.requestIndex},'reject')">Reject</button>
            </td>
          </tr>`).join('')}</table>`;
      } catch (e) { el.innerHTML = '<p class="error">Failed to load</p>'; }
    }

    async function withdrawAction(userId, requestIndex, action) {
      await fetch(API + '/withdraw-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ userId, requestIndex, action })
      });
      loadWithdraws();
    }

    async function loadUsers() {
      const el = document.getElementById('usersList');
      try {
        const res = await fetch(API + '/users', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        el.innerHTML = `<table><tr><th>Name</th><th>Phone</th><th>Balance</th><th>Joined</th></tr>
          ${data.map(u => `<tr><td>${u.name}</td><td>${u.phone}</td><td>৳${u.balance}</td><td>${new Date(u.createdAt).toLocaleDateString()}</td></tr>`).join('')}</table>`;
      } catch (e) { el.innerHTML = '<p class="error">Failed to load</p>'; }
    }

    // ====================== DEPOSIT SETTINGS ======================

    async function loadMethods() {
      const el = document.getElementById('methodsList');
      try {
        const res = await fetch(API + '/deposit-methods', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        if (!data.length) {
          el.innerHTML = '<p style="color:#aaa;margin-top:10px;">এখনো কোনো মেথড যোগ করা হয়নি।</p>';
          return;
        }
        el.innerHTML = `<table>
          <tr>
            <th>Logo</th>
            <th>Name</th>
            <th>Number</th>
            <th>Instructions</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
          ${data.map(m => `
            <tr>
              <td>${m.logo ? `<img src="${m.logo}" class="method-logo" onerror="this.style.display='none'">` : '-'}</td>
              <td><strong>${m.name}</strong></td>
              <td>${m.number}</td>
              <td style="max-width:200px;font-size:12px;color:#ccc;">${m.instructions || '-'}</td>
              <td class="${m.isActive ? 'status-on' : 'status-off'}">${m.isActive ? 'Active' : 'Inactive'}</td>
              <td>
                <button class="btn-sm btn-edit" onclick='editMethod(${JSON.stringify(m)})'>Edit</button>
                <button class="btn-sm btn-delete" onclick="deleteMethod('${m._id}')">Delete</button>
              </td>
            </tr>
          `).join('')}
        </table>`;
      } catch (e) {
        el.innerHTML = '<p class="error">Failed to load methods</p>';
      }
    }

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('methodName').value = '';
      document.getElementById('methodNumber').value = '';
      document.getElementById('methodLogo').value = '';
      document.getElementById('methodInstructions').value = '';
      document.getElementById('methodActive').value = 'true';
      document.getElementById('formTitle').textContent = 'নতুন মেথড যোগ করুন';
      document.getElementById('saveBtn').textContent = 'যোগ করুন';
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('settingsMsg').innerHTML = '';
    }

    function editMethod(m) {
      document.getElementById('editId').value = m._id;
      document.getElementById('methodName').value = m.name || '';
      document.getElementById('methodNumber').value = m.number || '';
      document.getElementById('methodLogo').value = m.logo || '';
      document.getElementById('methodInstructions').value = m.instructions || '';
      document.getElementById('methodActive').value = m.isActive ? 'true' : 'false';
      document.getElementById('formTitle').textContent = 'মেথড এডিট করুন';
      document.getElementById('saveBtn').textContent = 'আপডেট করুন';
      document.getElementById('cancelBtn').style.display = 'inline-block';
      document.getElementById('settingsMsg').innerHTML = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function saveMethod() {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('methodName').value.trim();
      const number = document.getElementById('methodNumber').value.trim();
      const logo = document.getElementById('methodLogo').value.trim();
      const instructions = document.getElementById('methodInstructions').value.trim();
      const isActive = document.getElementById('methodActive').value === 'true';
      const msg = document.getElementById('settingsMsg');

      if (!name || !number) {
        msg.innerHTML = '<div class="msg error">নাম এবং নম্বর আবশ্যক</div>';
        return;
      }

      try {
        let res;
        if (id) {
          // Update
          res = await fetch(API + '/deposit-methods/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ name, number, logo, instructions, isActive })
          });
        } else {
          // Add
          res = await fetch(API + '/deposit-methods', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ name, number, logo, instructions, isActive })
          });
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        msg.innerHTML = `<div class="msg success">${data.message}</div>`;
        resetForm();
        loadMethods();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    }

    async function deleteMethod(id) {
      if (!confirm('আপনি কি এই মেথড ডিলিট করতে চান?')) return;
      try {
        const res = await fetch(API + '/deposit-methods/' + id, {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        loadMethods();
      } catch (e) {
        alert(e.message);
      }
    }
  </script>
</body>
</html>
